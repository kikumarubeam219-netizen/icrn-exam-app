<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <g filter="url(#shadow)">
    <!-- Medical Cross -->
    <path d="M216 112h80v80h80v80h-80v80h-80v-80h-80v-80h80z" fill="#ffffff" fill-opacity="0.2" rx="16"/>
    <!-- Heartbeat / ECG line -->
    <path d="M96 288h80l24-48 36 96 36-120 28 84 20-36 16 24h80" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stethoscope / Badge Accent -->
    <circle cx="256" cy="192" r="32" fill="#ffffff"/>
    <circle cx="256" cy="192" r="20" fill="#0284c7"/>
    <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ICRN EXAM</text>
  </g>
</svg>
